name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    name: Find versions with successful main CI
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      candidates: ${{ steps.discover.outputs.candidates }}
      ready: ${{ steps.discover.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: discover
        run: python scripts/release.py discover
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: Package and publish ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.candidates) }}
    concurrency:
      group: release-${{ matrix.tag }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        working-directory: source
    env:
      CARGO_TARGET_DIR: target/rust-build
      RELEASE_TAG: ${{ matrix.tag }}
      RELEASE_SHA: ${{ matrix.sha }}
    steps:
      # Use current orchestration code even when retrying an older version tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck CI and publication after acquiring the tag lock
        id: ready
        run: python ../automation/scripts/release.py ready
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate version, main ancestry and CHANGELOG
        id: prepare
        if: steps.ready.outputs.ready == 'true'
        run: python ../automation/scripts/release.py prepare
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.ready.outputs.ready == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.ready.outputs.ready == 'true'
        with:
          workspaces: source -> ${{ env.CARGO_TARGET_DIR }}
          shared-key: windows-release-gpui-build
      - name: Build and verify native Windows installers
        if: steps.ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed' }
          ./scripts/build-gpui-windows.ps1 -Offline
          python scripts/audit-gpui-licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License audit failed' }
          python scripts/build_gpui_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Notice generation failed' }
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/stage-gpui-windows.ps1 -BinaryPath "$env:CARGO_TARGET_DIR/release/tp-gpui.exe" -OutputDirectory target/gpui-package/windows -NoticesPath target/gpui-third-party-notices.txt -ExpectedVersion $version
          python scripts/prepare_gpui_nsis.py --output target/gpui-tools/nsis
          if ($LASTEXITCODE -ne 0) { throw 'NSIS preparation failed' }
          python scripts/prepare_gpui_wix.py --output target/gpui-tools/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX preparation failed' }
          python scripts/package_gpui_windows_nsis.py --stage target/gpui-package/windows --output target/gpui-package/nsis --compiler target/gpui-tools/nsis/makensis.exe --plugins target/gpui-tools/nsis/Plugins/x86-unicode/additional
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          python scripts/package_gpui_windows_msi.py --stage target/gpui-package/windows --output target/gpui-package/msi --wix-tools target/gpui-tools/wix
          if ($LASTEXITCODE -ne 0) { throw 'MSI compilation failed' }
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          python scripts/verify_gpui_windows_nsis.py --installer "target/gpui-package/nsis/TP_${version}_x64-setup.exe" --stage target/gpui-package/windows --seven-zip $sevenZip
          if ($LASTEXITCODE -ne 0) { throw 'NSIS verification failed' }
          ./scripts/verify-gpui-msi.ps1 -MsiPath "target/gpui-package/msi/TP_${version}_x64_zh-CN.msi" -StageDirectory target/gpui-package/windows -DarkPath target/gpui-tools/wix/dark.exe
      - name: Upload Windows installers and publish Release from CHANGELOG
        if: steps.ready.outputs.ready == 'true'
        run: python ../automation/scripts/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
