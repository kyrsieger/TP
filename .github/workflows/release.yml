name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Wait for CI, package Windows and create draft
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate version, main ancestry and CHANGELOG
        run: node scripts/release.mjs prepare
      - name: Wait for this commit's main CI (up to 60 minutes)
        run: node scripts/release.mjs wait
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - name: Build Windows installers
        run: npm run tauri -- build --ci --bundles nsis,msi -- --locked
      - name: Create or update Release draft from CHANGELOG
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
