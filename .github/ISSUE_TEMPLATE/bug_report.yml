name: 问题反馈
description: 使用合成数据描述可复现的问题
body:
  - type: markdown
    attributes:
      value: 请先移除密码、令牌、个人路径和真实剪贴板内容，不在这里公开漏洞细节。
  - type: input
    id: version
    attributes:
      label: TP 版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统与版本
      placeholder: Windows 11 或 macOS 版本，并注明处理器架构
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供使用合成内容的最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 如需截图或日志，请先检查并脱敏；不要上传真实数据库。
