[package]
name = "tp-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tp-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
tp-core = { path = "../tp-core" }
tp-desktop = { path = "../tp-desktop" }
gpui-component = { version = "=0.5.1", default-features = false }
dirs = "6"
rfd = "0.15"
tray-icon = "0.24.2"
global-hotkey = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
dpi = "0.1.2"
chrono = "0.4"
unicode-segmentation = "1.13.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"

[dev-dependencies]
serde_json = "1"
