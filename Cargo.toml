[workspace]
members = ["crates/tp-core", "crates/tp-desktop", "crates/tp-gpui"]
exclude = ["vendor/gpui-component"]
resolver = "2"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
